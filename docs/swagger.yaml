basePath: /api
definitions:
  github_com_niuniu-dev_niuniu_internal_git.CommitDetail:
    properties:
      author:
        type: string
      author_email:
        type: string
      date:
        type: string
      files_changed:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_git.FileChange'
        type: array
      hash:
        type: string
      message:
        type: string
      short_hash:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.DiffHunk:
    properties:
      header:
        description: |-
          Header is the optional section heading git appends after the closing "@@"
          (usually the enclosing function), with surrounding spaces trimmed.
        type: string
      lines:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_git.DiffLine'
        type: array
      new_count:
        type: integer
      new_start:
        type: integer
      old_count:
        type: integer
      old_start:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_git.DiffLine:
    properties:
      content:
        type: string
      new_line:
        type: integer
      no_newline:
        description: NoNewline marks a line followed by git's "\ No newline at end
          of file".
        type: boolean
      old_line:
        description: |-
          OldLine/NewLine are 1-based line numbers, 0 when the line does not exist
          on that side (adds have no OldLine, deletes have no NewLine).
        type: integer
      type:
        description: context|add|delete
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.FileChange:
    properties:
      path:
        type: string
      status:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.FileDiff:
    properties:
      additions:
        type: integer
      deletions:
        type: integer
      hunks:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_git.DiffHunk'
        type: array
      is_binary:
        description: |-
          IsBinary is true only when git reported the file as an actual binary blob
          ("Binary files ... differ" / "GIT binary patch"). A diff with zero hunks is
          NOT necessarily binary — mode-only changes (chmod +x), pure renames and
          empty files also produce no hunks. Clients must gate the "can't preview"
          message on this flag, never on len(Hunks) == 0.
        type: boolean
      new_mode:
        type: string
      old_mode:
        description: |-
          OldMode/NewMode carry the file mode pair when the diff reports one, so a
          content-less mode change can be described instead of shown as binary.
        type: string
      old_path:
        description: |-
          OldPath is the pre-change path, set only for renames and copies (where it
          differs from Path). Empty otherwise.
        type: string
      path:
        type: string
      raw_patch:
        type: string
      status:
        description: added|modified|deleted|renamed|copied
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.FileEntry:
    properties:
      mode:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      type:
        description: '"file" or "dir"'
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.FileLogEntry:
    properties:
      author:
        type: string
      date:
        type: string
      hash:
        type: string
      message:
        type: string
      path_at_commit:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.GraphCommit:
    properties:
      author:
        type: string
      date:
        type: string
      hash:
        type: string
      is_current:
        type: boolean
      message:
        type: string
      parents:
        items:
          type: string
        type: array
      refs:
        items:
          type: string
        type: array
      short_hash:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.LogEntry:
    properties:
      author:
        type: string
      date:
        type: string
      hash:
        type: string
      message:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_git.WorktreeInfo:
    properties:
      branch:
        type: string
      has_changes:
        type: boolean
      is_current:
        type: boolean
      path:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_intake.RuleConditions:
    properties:
      actors:
        items:
          type: string
        type: array
      keywords:
        items:
          type: string
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_integration.ExternalComment:
    properties:
      author:
        type: string
      body:
        type: string
      created_at:
        description: as-provided by source (RFC3339 for GitHub, "YYYY-MM-DD HH:MM:SS"
          for TAPD)
        type: string
      id:
        type: string
      url:
        description: direct link to the comment in the external UI
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.AcceptDecisionInput:
    properties:
      brief:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.DecisionBriefDraft'
      target_issue_id:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.BatchDeleteResult:
    properties:
      accepted:
        items:
          type: integer
        type: array
      skipped:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.BatchSkippedItem'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.BatchSkippedItem:
    properties:
      id:
        type: integer
      reason:
        description: not_found | has_changes | already_deleting | error
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.BranchTree:
    properties:
      current_branch:
        type: string
      local_branches:
        items:
          type: string
        type: array
      remote_branches:
        items:
          type: string
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CommentAnchor:
    properties:
      context:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.CommentContext'
      current:
        allOf:
        - $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.CommentContext'
        description: |-
          Current is what the anchored line looks like NOW, when that differs from the
          snapshot in Context. Judging "did this actually get fixed?" needs both sides:
          Context is what the reviewer commented on, Current is what replaced it. Nil
          when the line is unchanged (Context already shows it) or when the anchor is
          outdated (there is no current line to show).
      current_blob_sha:
        description: |-
          CurrentBlobSha is the file's blob hash right now; "" when the file is gone
          or unreadable. Callers re-pin a relocated comment to it.
        type: string
      effective_line:
        type: integer
      original_line:
        type: integer
      side:
        type: string
      status:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CommentContext:
    properties:
      after:
        items:
          type: string
        type: array
      before:
        items:
          type: string
        type: array
      line:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CompletionProfileDTO:
    properties:
      autohost_enabled:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      issue_count:
        description: |-
          IssueCount is how many issues currently select this profile. The UI shows
          it and refuses deletion while non-zero (design §6.7.4); the server still
          enforces the same guard in DeleteProfile.
        type: integer
      max_rounds:
        type: integer
      name:
        type: string
      project_id:
        type: integer
      require_review:
        type: boolean
      stop_on_decision:
        type: boolean
      token_budget:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CompletionProfileInput:
    properties:
      autohost_enabled:
        type: boolean
      max_rounds:
        type: integer
      name:
        type: string
      require_review:
        type: boolean
      stop_on_decision:
        type: boolean
      token_budget:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CompletionSettingsInput:
    properties:
      autohost_enabled:
        type: boolean
      max_rounds:
        type: integer
      require_review:
        type: boolean
      stop_on_decision:
        type: boolean
      token_budget:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CompletionSettingsView:
    properties:
      autohost_enabled:
        type: boolean
      max_rounds:
        type: integer
      project_id:
        type: integer
      require_review:
        type: boolean
      stop_on_decision:
        type: boolean
      token_budget:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.CreatorBrief:
    properties:
      display_name:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.DecisionBriefDraft:
    properties:
      Acceptance:
        items:
          type: string
        type: array
      Goal:
        type: string
      ScopeIn:
        items:
          type: string
        type: array
      ScopeOut:
        items:
          type: string
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.DeliverySpec:
    properties:
      reply_mode:
        type: string
      source_kind:
        type: string
      thread_ext_id:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.GitIdentity:
    properties:
      configured:
        type: boolean
      email:
        type: string
      name:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IgnoreDecisionInput:
    properties:
      reason:
        type: string
      reason_code:
        type: string
      reason_text:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeCalibrationRecord:
    properties:
      actor_ext_id:
        type: string
      actor_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      outcome:
        description: accepted | ignored
        type: string
      reason_code:
        type: string
      reason_text:
        type: string
      source_kind:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeCalibrationSourceStats:
    properties:
      acceptance_rate:
        type: number
      accepted:
        type: integer
      calibrated:
        type: integer
      ignored:
        type: integer
      pending:
        type: integer
      source_kind:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeCalibrationStats:
    properties:
      acceptance_rate:
        type: number
      accepted:
        type: integer
      calibrated:
        type: integer
      ignored:
        type: integer
      min_acceptance_rate:
        type: number
      min_calibrated:
        type: integer
      pending:
        type: integer
      project_id:
        type: integer
      ready:
        type: boolean
      recent:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IntakeCalibrationRecord'
        type: array
      sources:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IntakeCalibrationSourceStats'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeDailyCount:
    properties:
      count:
        type: integer
      day:
        description: YYYY-MM-DD, local time
        type: string
      source_kind:
        type: string
      thread_ext_id:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeDecisionDTO:
    properties:
      actor_ext_id:
        type: string
      actor_name:
        type: string
      created_at:
        type: string
      decision:
        type: string
      delivery_error:
        type: string
      delivery_failed:
        description: |-
          DeliveryFailed reports that the task/workspace was created and recorded,
          but handing the message to its agent failed. The entry still counts as
          accepted — the UI warns so the user can open the task manually.
        type: boolean
      event_id:
        type: integer
      event_kind:
        type: string
      executed:
        type: boolean
      id:
        type: integer
      issue_id:
        type: integer
      matched_rule_ids:
        items:
          type: integer
        type: array
      mode_at_decision:
        type: string
      payload:
        items:
          type: integer
        type: array
      policy_version:
        type: integer
      project_id:
        type: integer
      reason_code:
        type: string
      reason_text:
        type: string
      source_kind:
        type: string
      status:
        description: |-
          Status is the queue-facing state derived from decision+executed:
          pending | accepted | ignored. Deriving it keeps the schema unchanged.
        type: string
      strength:
        type: string
      thread_ext_id:
        type: string
      workspace_id:
        type: integer
      would_do:
        items:
          type: integer
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakePolicyVersionDTO:
    properties:
      created_at:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      snapshot:
        items:
          type: integer
        type: array
      source_kind:
        type: string
      version:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeRuleDTO:
    properties:
      conditions:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_intake.RuleConditions'
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      instruction:
        type: string
      name:
        type: string
      priority:
        type: integer
      project_id:
        type: integer
      source_kind:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeSettingDTO:
    properties:
      allow_list:
        items:
          type: string
        type: array
      bot_list:
        items:
          type: string
        type: array
      daily_cap:
        type: integer
      mode:
        type: string
      source_kind:
        type: string
      updated_at:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeSettingInput:
    properties:
      allow_list:
        items:
          type: string
        type: array
      bot_list:
        items:
          type: string
        type: array
      daily_cap:
        type: integer
      mode:
        type: string
      source_kind:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IntakeSettingsView:
    properties:
      paused:
        description: |-
          Paused is the project-level stop switch: while true the pipeline forces
          every source to mode off, so inferred/observe work stops immediately
          while explicit requests keep working.
        type: boolean
      project_id:
        type: integer
      settings:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IntakeSettingDTO'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.IssueBriefView:
    properties:
      brief:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.TaskBriefView'
      goal_condition:
        type: string
      issue_id:
        type: integer
      provenance_event:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.ProvenanceEventView'
      versions:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.TaskBriefView'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.MissionControlCompletion:
    properties:
      metrics:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.MissionControlMetric'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.MissionControlIntake:
    properties:
      metrics:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.MissionControlMetric'
        type: array
      paused:
        type: boolean
      per_chat:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IntakeDailyCount'
        type: array
      per_source:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IntakeDailyCount'
        type: array
      project_count:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.MissionControlMetric:
    properties:
      denom:
        type: integer
      drill:
        description: intake | intake_source | workspaces | tokens
        type: string
      key:
        type: string
      num:
        description: |-
          Num/Denom carry the sample the value was computed from (e.g. 3 of 12) so
          the tile can show a muted ratio without the server sending prose.
        type: integer
      status:
        description: ok | warning | no_data
        type: string
      unit:
        description: count | percent | minutes | rounds | tokens | usd
        type: string
      value:
        type: number
    type: object
  github_com_niuniu-dev_niuniu_internal_service.MissionControlView:
    properties:
      completion:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.MissionControlCompletion'
      intake:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.MissionControlIntake'
    type: object
  github_com_niuniu-dev_niuniu_internal_service.Provenance:
    properties:
      actor_ext_id:
        type: string
      decision_id:
        type: integer
      policy_version:
        type: integer
      rule_ids:
        items:
          type: integer
        type: array
      strength:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.ProvenanceEventView:
    properties:
      actor_ext_id:
        type: string
      actor_name:
        type: string
      event_ext_id:
        type: string
      event_kind:
        type: string
      payload:
        items:
          type: integer
        type: array
      received_at:
        type: string
      rule_names:
        items:
          type: string
        type: array
      source_kind:
        type: string
      source_ref:
        type: string
      text:
        description: |-
          Text and URL are source-neutral projections of Payload: adapters keep
          their own raw shape (IM marshals Go field names, GitHub the REST JSON), so
          the popover reads these instead of guessing keys.
        type: string
      thread_ext_id:
        type: string
      url:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.RepoDiff:
    properties:
      base_branch:
        type: string
      clone_url:
        description: |-
          CloneURL is the registered repository's git remote, or "" when the repo
          has no remote (or is unresolved). The desktop local-runner reads it to
          seed-clone an empty bound directory (#478); the SPA ignores it.
        type: string
      current_branch:
        description: |-
          CurrentBranch is the worktree's own checked-out branch (HEAD). Sourced
          from the worktree row directly so it is present even for stale/orphan
          associations (the sidebar's repo JOIN would drop those).
        type: string
      files:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_git.FileDiff'
        type: array
      name:
        type: string
      repository_id:
        type: integer
      worktree_path:
        type: string
    type: object
  github_com_niuniu-dev_niuniu_internal_service.RepositoryStats:
    properties:
      last_commit_date:
        type: string
      total_branches:
        type: integer
      total_commits:
        type: integer
      total_contributors:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.SystemDepsInfo:
    properties:
      browser_cli_login:
        description: |-
          BrowserCLILogin is true when the server can host an interactive agent-CLI
          login inside a browser terminal (GET /ws/cli-login/:tool/terminal). This is
          how team-edition users log in: the server runs in a container where the
          native-terminal launch used by personal mode is impossible, so the CLI runs
          server-side in a PTY and the browser is the terminal (#677). Decorated by
          SystemDepsHandler. Admin-only — the SPA also gates the button on role.
        type: boolean
      can_install:
        type: boolean
      package_manager:
        type: string
      personal_mode:
        description: |-
          PersonalMode is true when niuniu-server runs in personal/embedded mode
          (cfg.Auth.Enabled=false). Host-shell ops (open terminal, open path) are
          only meaningful in this mode. Decorated by SystemDepsHandler.
        type: boolean
      platform:
        type: string
      tools:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.ToolStatus'
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.TaskBriefInput:
    properties:
      acceptance:
        items:
          type: string
        type: array
      delivery:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.DeliverySpec'
      goal:
        type: string
      provenance:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.Provenance'
      scope_in:
        items:
          type: string
        type: array
      scope_out:
        items:
          type: string
        type: array
    type: object
  github_com_niuniu-dev_niuniu_internal_service.TaskBriefView:
    properties:
      acceptance:
        items:
          type: string
        type: array
      created_at:
        type: string
      created_by:
        type: integer
      delivery:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.DeliverySpec'
      goal:
        type: string
      id:
        type: integer
      intake_decision_id:
        type: integer
      issue_id:
        type: integer
      policy_version:
        type: integer
      provenance:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.Provenance'
      scope_in:
        items:
          type: string
        type: array
      scope_out:
        items:
          type: string
        type: array
      version:
        type: integer
    type: object
  github_com_niuniu-dev_niuniu_internal_service.ToolExtras:
    properties:
      git_identity:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.GitIdentity'
    type: object
  github_com_niuniu-dev_niuniu_internal_service.ToolStatus:
    properties:
      extras:
        $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.ToolExtras'
      found:
        type: boolean
      installable:
        description: |-
          Installable mirrors whether Install would actually run a package-manager
          command for this tool right now (vs. fall back to a redirect URL). It
          captures per-tool nuance the page-level CanInstall cannot:
            - "claude" depends on npm (which ships with node), NOT the OS PM, so
              claude is installable on a LTSC Windows box that has node but no
              winget — even though CanInstall is false.
            - "node"/"python3"/"git" need an OS PM (winget/brew/apt-get).
            - Always false in team edition.
          The SPA gates per-tool install buttons on this; CanInstall stays the
          page-level "system PM available" signal used by the top-of-page message.
        type: boolean
      logged_in:
        description: |-
          LoggedIn reports whether this CLI already has credentials on the server.
