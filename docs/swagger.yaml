basePath: /api
definitions:
  api.AddRepositoryRequest:
    properties:
      branch:
        type: string
      repository_id:
        type: string
    required:
    - repository_id
    type: object
  api.BgTaskAggregateDTO:
    properties:
      agent_busy:
        type: boolean
      bash_count:
        type: integer
      cron_count:
        type: integer
      highlight:
        $ref: '#/definitions/api.BgTaskHighlight'
      subagent_count:
        type: integer
      wakeup_count:
        type: integer
    type: object
  api.BgTaskHighlight:
    properties:
      kind:
        description: '"bash" | "subagent" | "wakeup"'
        type: string
      scheduled_for:
        description: RFC3339, set for wakeup
        type: string
      started_at:
        description: RFC3339, set for bash/subagent
        type: string
      title:
        type: string
    type: object
  api.BranchesResponse:
    properties:
      branches:
        items:
          type: string
        type: array
      current_branch:
        type: string
    type: object
  api.ChecklistStatsDTO:
    properties:
      completed:
        type: integer
      total:
        type: integer
    type: object
  api.ColumnIssueStat:
    properties:
      column_name:
        type: string
      count:
        type: integer
    type: object
  api.CommentResponse:
    properties:
      content:
        example: This is a great comment!
        type: string
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      file_path:
        example: /path/to/file.go
        type: string
      id:
        type: integer
      line_number:
        example: 42
        type: integer
      sent_to_agent:
        example: true
        type: boolean
      workspace_id:
        type: integer
    type: object
  api.CommitRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  api.CreateColumnRequest:
    properties:
      lifecycle_mapping:
        type: string
      name:
        type: string
      position:
        type: integer
    required:
    - name
    type: object
  api.CreateCommentRequest:
    properties:
      content:
        type: string
      file_path:
        type: string
      line_number:
        type: integer
    required:
    - content
    - file_path
    type: object
  api.CreateIssueRequest:
    properties:
      assignee_user_ids:
        items:
          type: integer
        type: array
      description:
        type: string
      due_date:
        type: string
      estimate:
        type: number
      estimate_type:
        type: string
      label_ids:
        items:
          type: integer
        type: array
      position:
        type: integer
      priority:
        type: integer
      start_date:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  api.CreateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  api.CreateRepositoryRequest:
    properties:
      auto_init:
        description: Pointer to distinguish between unset and false
        type: boolean
      name:
        type: string
      path:
        type: string
      remote_url:
        type: string
    type: object
  api.CreateWorkspaceErrorEntry:
    properties:
      error:
        type: string
      repository_id:
        type: string
    type: object
  api.CreateWorkspaceOwnerRequest:
    properties:
      id:
        type: integer
      type:
        type: string
    type: object
  api.CreateWorkspaceRequest:
    properties:
      issue_id:
        description: nullable int64
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/api.CreateWorkspaceOwnerRequest'
      repos:
        items:
          $ref: '#/definitions/api.RepoBranchRequest'
        type: array
    type: object
  api.CreateWorkspaceResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/api.CreateWorkspaceErrorEntry'
        type: array
      id:
        type: string
      issue_id:
        type: string
      path:
        type: string
      repositories:
        items:
          $ref: '#/definitions/api.CreateWorkspaceSuccessRepo'
        type: array
      status:
        type: string
      warnings:
        items:
          type: string
        type: array
    type: object
  api.CreateWorkspaceSuccessRepo:
    properties:
      branch:
        type: string
      id:
        type: string
      repository_id:
        type: string
      worktree_path:
        type: string
    type: object
  api.DirectoryEntry:
    properties:
      name:
        type: string
      path:
        type: string
    type: object
  api.DirectoryListResponse:
    properties:
      directories:
        items:
          $ref: '#/definitions/api.DirectoryEntry'
        type: array
      parent:
        type: string
      path:
        type: string
    type: object
  api.Error:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetail'
    type: object
  api.ErrorDetail:
    properties:
      code:
        example: PROJECT_NOT_FOUND
        type: string
      details: {}
      message:
        example: Project not found
        type: string
    type: object
  api.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/api.ErrorDetail'
    type: object
  api.FileContentResponse:
    properties:
      content:
        type: string
      path:
        type: string
      size:
        type: integer
    type: object
  api.GitStatusResponse:
    properties:
      added:
        items:
          type: string
        type: array
      deleted:
        items:
          type: string
        type: array
      modified:
        items:
          type: string
        type: array
      untracked:
        items:
          type: string
        type: array
    type: object
  api.IssueAssigneeResponse:
    properties:
      display_name:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  api.IssueResponse:
    properties:
      actual_time:
        type: number
      assignees:
        items:
          $ref: '#/definitions/api.IssueAssigneeResponse'
        type: array
      checklist_stats:
        $ref: '#/definitions/api.ChecklistStatsDTO'
      column_id:
        type: integer
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      description:
        example: Add JWT-based user authentication
        type: string
      due_date:
        type: string
      estimate:
        type: number
      estimate_type:
        type: string
      id:
        type: integer
      labels:
        items:
          $ref: '#/definitions/api.LabelResponse'
        type: array
      lifecycle_status:
        example: created
        type: string
      position:
        example: 0
        type: integer
      priority:
        example: 1
        type: integer
      project_id:
        type: integer
      start_date:
        type: string
      title:
        example: Implement user authentication
        type: string
      updated_at:
        example: "2026-03-17T12:00:00Z"
        type: string
    type: object
  api.LabelResponse:
    properties:
      color:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      project_id:
        type: integer
    type: object
  api.MoveIssueRequest:
    properties:
      column_id:
        type: integer
      position:
        minimum: 0
        type: integer
    required:
    - column_id
    type: object
  api.OwnerDTO:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      type:
        type: string
    type: object
  api.ProjectRepositoryBinding:
    properties:
      name:
        type: string
      path:
        type: string
      project_default_branch:
        type: string
      repo_default_branch:
        type: string
      repository_id:
        type: integer
    type: object
  api.ProjectResponse:
    properties:
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      description:
        example: A sample project
        type: string
      id:
        type: integer
      issue_stats:
        items:
          $ref: '#/definitions/api.ColumnIssueStat'
        type: array
      name:
        example: My Project
        type: string
      owner:
        $ref: '#/definitions/api.OwnerDTO'
      repositories:
        items:
          $ref: '#/definitions/api.ProjectRepositoryBinding'
        type: array
      status:
        example: active
        type: string
      updated_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      ws_stats:
        items:
          $ref: '#/definitions/api.WsStatusStat'
        type: array
    type: object
  api.RepoBranchRequest:
    properties:
      branch:
        description: |-
          Branch is the base branch the new worktree forks from. Required so the
          server never silently falls back to a guessed default (e.g. "main") that
          may not exist in the repo — that fallback used to leave the workspace
          shell in place with no worktree on disk and the failure swallowed.
        type: string
      repo_id:
        description: int64
        type: integer
    required:
    - branch
    - repo_id
    type: object
  api.RepositoryResponse:
    properties:
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      default_branch:
        example: main
        type: string
      git_remote:
        example: https://github.com/niuniu-dev/niuniu.git
        type: string
      id:
        type: integer
      name:
        example: My Repository
        type: string
      owner:
        $ref: '#/definitions/api.OwnerDTO'
      path:
        example: /path/to/repo
        type: string
      total_branches:
        example: 3
        type: integer
      updated_at:
        example: "2026-03-17T12:00:00Z"
        type: string
    type: object
  api.SendInputRequest:
    properties:
      input:
        type: string
    required:
    - input
    type: object
  api.SetEnvRequest:
    properties:
      env:
        additionalProperties:
          type: string
        type: object
    type: object
  api.StartAgentRequest:
    properties:
      prompt:
        type: string
    type: object
  api.SystemInfoResponse:
    properties:
      disk_drives:
        description: Windows drive letters, empty on Linux
        items:
          type: string
        type: array
      os:
        description: '"windows" or "linux"'
        type: string
    type: object
  api.TaskStatsDTO:
    properties:
      completed:
        type: integer
      current_task:
        type: string
      total:
        type: integer
    type: object
  api.UpdateColumnPositionRequest:
    properties:
      position:
        type: integer
    type: object
  api.UpdateColumnRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  api.UpdateIssueRequest:
    properties:
      actual_time:
        type: number
      description:
        type: string
      due_date:
        type: string
      estimate:
        type: number
      estimate_type:
        type: string
      priority:
        type: integer
      start_date:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  api.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  api.UpdateRepositoryRequest:
    properties:
      default_branch:
        type: string
      git_remote:
        type: string
      name:
        type: string
      path:
        type: string
    required:
    - name
    - path
    type: object
  api.WorkspaceResponse:
    properties:
      agent_pid:
        example: 12345
        type: integer
      agent_status:
        example: idle
        type: string
      ahead_count:
        type: integer
      archived_at:
        type: string
      bg_tasks:
        $ref: '#/definitions/api.BgTaskAggregateDTO'
      changes_count:
        type: integer
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      created_by:
        type: integer
      harness_id:
        type: integer
      id:
        type: string
      is_archived:
        type: integer
      issue_id:
        type: string
      lifecycle_status:
        type: string
      name:
        example: My Workspace
        type: string
      owner:
        $ref: '#/definitions/api.OwnerDTO'
      path:
        example: /path/to/workspace
        type: string
      project_name:
        type: string
      project_owner_id:
        type: integer
      project_owner_name:
        type: string
      project_owner_type:
        type: string
      schedule_count:
        type: integer
      status:
        example: active
        type: string
      task_stats:
        $ref: '#/definitions/api.TaskStatsDTO'
      updated_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      worktrees:
        items:
          $ref: '#/definitions/api.WorktreeSidebarDTO'
        type: array
    type: object
  api.WorktreeSidebarDTO:
    properties:
      ahead_count:
        type: integer
      base_branch:
        type: string
      branch:
        type: string
      changes_count:
        type: integer
      name:
        type: string
      repo_name:
        type: string
    type: object
  api.WsStatusStat:
    properties:
      count:
        type: integer
      status:
        type: string
    type: object
  api.installReq:
    properties:
      name:
        type: string
    type: object
  api.installResp:
    properties:
      fallback_url:
        type: string
      job_id:
        type: string
    type: object
  api.setGitIdentityReq:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  git.CommitDetail:
    properties:
      author:
        type: string
      author_email:
        type: string
      date:
        type: string
      files_changed:
        items:
          $ref: '#/definitions/git.FileChange'
        type: array
      hash:
        type: string
      message:
        type: string
      short_hash:
        type: string
    type: object
  git.DiffHunk:
    properties:
      content:
        type: string
      new_count:
        type: integer
      new_start:
        type: integer
      old_count:
        type: integer
      old_start:
        type: integer
    type: object
  git.FileChange:
    properties:
      path:
        type: string
      status:
        type: string
    type: object
  git.FileDiff:
    properties:
      additions:
        type: integer
      deletions:
        type: integer
      hunks:
        items:
          $ref: '#/definitions/git.DiffHunk'
        type: array
      path:
        type: string
      raw_patch:
        type: string
      status:
        description: added|modified|deleted|renamed
        type: string
    type: object
  git.FileEntry:
    properties:
      mode:
        type: string
      name:
        type: string
      path:
        type: string
      size:
        type: integer
      type:
        description: '"file" or "dir"'
        type: string
    type: object
  git.GraphCommit:
    properties:
      author:
        type: string
      date:
        type: string
      hash:
        type: string
      is_current:
        type: boolean
      message:
        type: string
      parents:
        items:
          type: string
        type: array
      refs:
        items:
          type: string
        type: array
      short_hash:
        type: string
    type: object
  git.LogEntry:
    properties:
      author:
        type: string
      date:
        type: string
      hash:
        type: string
      message:
        type: string
    type: object
  git.WorktreeInfo:
    properties:
      branch:
        type: string
      has_changes:
        type: boolean
      is_current:
        type: boolean
      path:
        type: string
    type: object
  service.BranchTree:
    properties:
      current_branch:
        type: string
      local_branches:
        items:
          type: string
        type: array
      remote_branches:
        items:
          type: string
        type: array
    type: object
  service.GitIdentity:
    properties:
      configured:
        type: boolean
      email:
        type: string
      name:
        type: string
    type: object
  service.RepositoryStats:
    properties:
      last_commit_date:
        type: string
      total_branches:
        type: integer
      total_commits:
        type: integer
      total_contributors:
        type: integer
    type: object
  service.SystemDepsInfo:
    properties:
      can_install:
        type: boolean
      package_manager:
        type: string
      personal_mode:
        description: |-
          PersonalMode is true when niuniu-server runs in personal/embedded mode
          (cfg.Auth.Enabled=false). Host-shell ops (open terminal, open path) are
          only meaningful in this mode. Decorated by SystemDepsHandler.
        type: boolean
      platform:
        type: string
      tools:
        items:
          $ref: '#/definitions/service.ToolStatus'
        type: array
    type: object
  service.ToolExtras:
    properties:
      git_identity:
        $ref: '#/definitions/service.GitIdentity'
    type: object
  service.ToolStatus:
    properties:
      extras:
        $ref: '#/definitions/service.ToolExtras'
      found:
        type: boolean
      name:
        type: string
      path:
        type: string
      version:
        type: string
    type: object
  store.Column:
    properties:
      id:
        type: integer
      lifecycle_mapping:
        type: string
      name:
        type: string
      position:
        type: integer
      project_id:
        type: integer
    type: object
host: localhost:3000
info:
  contact:
    name: Niuniu
    url: https://github.com/niuniu-dev/niuniu
  description: Niuniu is a full-stack application for managing multi-project, multi-task
    parallel development with Claude Code integration.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Niuniu API
  version: 1.0.0
paths:
  /columns/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a column and all associated issues
      parameters:
      - description: Column ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Delete a column
      tags:
      - Columns
    put:
      consumes:
      - application/json
      description: Update column details
      parameters:
      - description: Column ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated column details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateColumnRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Column'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Update a column
      tags:
      - Columns
  /columns/{id}/issues:
    get:
      consumes:
      - application/json
      description: Get all issues for a column
      parameters:
      - description: Column ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.IssueResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: List issues
      tags:
      - Issues
    post:
      consumes:
      - application/json
      description: Create a new issue for a column
      parameters:
      - description: Column ID
        in: path
        name: id
        required: true
        type: string
      - description: Issue details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.CreateIssueRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.IssueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Create an issue
      tags:
      - Issues
  /columns/{id}/position:
    put:
      consumes:
      - application/json
      description: Update column position by swapping with another column
      parameters:
      - description: Column ID
        in: path
        name: id
        required: true
        type: string
      - description: New position
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.UpdateColumnPositionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Update column position
      tags:
      - Columns
  /comments/{id}/send-to-agent:
    post:
      consumes:
      - application/json
      description: Send a comment to the agent as feedback
      parameters:
      - description: Comment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Send comment to agent
      tags:
      - Review
  /directories:
    get:
      description: Get subdirectories for a given path
      parameters:
      - description: Absolute path to list
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.DirectoryListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: List directories
      tags:
      - Directories
  /issues/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an issue
      parameters:
      - description: Issue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Delete an issue
      tags:
      - Issues
    get:
      description: Get issue details by ID
      parameters:
      - description: Issue ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.IssueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Error'
      summary: Get an issue
      tags:
      - Issues
    put:
      consumes:
      - application/json
      description: Update issue details
      parameters:
      - description: Issue ID
        in: path
        name: id
