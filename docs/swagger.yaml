      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.IssueBriefView'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Error'
