        example: /path/to/file.go
        type: string
      id:
        type: integer
      line_number:
        example: 42
        type: integer
      repo:
        example: niuniu
        type: string
      resolved:
        description: Resolved is the REVIEW verdict, independent of SentToAgent (delivery).
        example: false
        type: boolean
      resolved_at:
        type: string
      resolved_by:
        type: string
      sent_to_agent:
        example: true
        type: boolean
      side:
        description: |-
          Side is "old" (a line the diff deletes) or "new" — old-side anchoring is
          what makes deleted lines commentable.
        example: new
        type: string
      workspace_id:
        type: integer
