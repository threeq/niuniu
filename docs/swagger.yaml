        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.Error'
      summary: Update an issue
      tags:
      - Issues
  /issues/{id}/brief:
    get:
      description: Current brief (highest version) plus all versions, newest first.
        brief is null for issues that did not come from Intake.
      parameters:
      - description: Issue ID
        in: path
        name: id
        required: true
        type: integer
      produces:
