        type: string
      ahead_count:
        type: integer
      archived_at:
        type: string
      bg_tasks:
        $ref: '#/definitions/internal_api.BgTaskAggregateDTO'
      changes_count:
        type: integer
      cli_type:
        example: claude
        type: string
      codex_approval_policy:
        type: string
      codex_sandbox_mode:
        description: |-
          Codex-only fields. Always populated for codex workspaces (defaults
          applied if column is empty). Ignored by the SPA for claude workspaces.
        type: string
      created_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      created_by:
        type: integer
      creator_owner:
        $ref: '#/definitions/internal_api.OwnerDTO'
      env_provider_group:
        description: |-
          EnvProviderGroup is the provider-group binding ('' = none). Mutually
          exclusive with EnvProviderID; the workspace resolves the group's best
          usable member in manual order.
        type: string
      env_provider_id:
        description: |-
          EnvProviderID is the directly-bound subscription-platform provider (issue
          #653). nil = no direct binding (env comes from scene/ explicit workspace_env).
        type: integer
      id:
        type: string
      is_archived:
        type: integer
      is_studio:
        description: |-
          IsStudio marks workspaces created via the studio "from local directory"
          flow (#232). The SPA shows the delivery hint (#238) when true.
        type: integer
      issue_id:
        type: string
      issue_type:
        description: |-
          IssueType is the linked issue's type ('task'|'epic'). Omitted for regular
          tasks and workspaces with no linked issue; the SPA renders an Epic marker
          in the sidebar only when this is "epic".
        type: string
      last_message_at:
        type: string
      lifecycle_status:
        type: string
      message_count:
        type: integer
      name:
        example: My Workspace
        type: string
      owner:
        $ref: '#/definitions/internal_api.OwnerDTO'
      parent_issue_id:
        description: |-
          ParentIssueID is the linked issue's parent (the Epic it belongs to).
          Present only when the linked issue is a sub-issue; the SPA renders a
          sub-issue marker in the sidebar when this is set.
        type: integer
      path:
        example: /path/to/workspace
        type: string
      project_name:
        type: string
      project_owner_id:
        type: integer
      project_owner_name:
        type: string
      project_owner_type:
        type: string
      schedule_count:
        type: integer
      status:
        example: active
        type: string
      task_stats:
        $ref: '#/definitions/internal_api.TaskStatsDTO'
      updated_at:
        example: "2026-03-17T12:00:00Z"
        type: string
      worktrees:
        items:
          $ref: '#/definitions/internal_api.WorktreeSidebarDTO'
        type: array
    type: object
  internal_api.WorktreeGitStatusDTO:
    properties:
      ahead_count:
        type: integer
      changes_count:
        type: integer
      name:
        type: string
    type: object
  internal_api.WorktreeSidebarDTO:
    properties:
      ahead_count:
        type: integer
      base_branch:
        type: string
      branch:
        type: string
      changes_count:
        type: integer
      name:
        type: string
      repo_name:
        type: string
    type: object
  internal_api.WsStatusStat:
    properties:
      count:
        type: integer
      status:
        type: string
    type: object
  internal_api.batchDeleteWorkspacesRequest:
    properties:
      force:
        description: |-
          Force skips the per-workspace uncommitted/unmerged change check. When
          false, a workspace with changes is reported in `skipped` (reason
          "has_changes") instead of being destroyed.
        type: boolean
      workspace_ids:
        items:
          type: integer
        type: array
    required:
    - workspace_ids
    type: object
  internal_api.contentFileResult:
    properties:
      matches:
        items:
          $ref: '#/definitions/internal_api.contentMatch'
        type: array
      path:
        description: |-
          Path is workspace-root-relative with forward slashes, e.g.
          ".worktrees/niuniu-main/internal/api/filetree.go".
        type: string
      repo:
        description: Repo is the `.worktrees/<name>` subdir, or "" for workspace-root
          files.
        type: string
      truncated:
        description: Truncated means this file hit contentMaxPerFile and has more
          matches.
        type: boolean
    type: object
  internal_api.contentMatch:
    properties:
      after:
        items:
          type: string
        type: array
      before:
        description: |-
          Before/After hold up to `context` lines around the match. The git-grep
          fallback cannot label context lines unambiguously, so it returns none.
        items:
          type: string
        type: array
      columns:
        description: |-
          Columns are [start,end) BYTE offsets of each match within Text, letting
          the client highlight the hit. Only ripgrep reports these.
        items:
          items:
            type: integer
          type: array
        type: array
      line:
        type: integer
      lineTruncated:
        description: LineTruncated marks a line cut to contentMaxLineLen.
        type: boolean
      text:
        type: string
    type: object
  internal_api.installReq:
    properties:
      name:
        type: string
    type: object
  internal_api.installResp:
    properties:
      fallback_url:
        type: string
      job_id:
        type: string
    type: object
  internal_api.overviewCreatorsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_niuniu-dev_niuniu_internal_service.CreatorBrief'
        type: array
    type: object
  internal_api.repoFileHit:
    properties:
      name:
        type: string
      path:
        type: string
    type: object
  internal_api.setGitIdentityReq:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  releasecheck.Asset:
    properties:
      browser_download_url:
        type: string
      name:
        type: string
    type: object
  releasecheck.Release:
    properties:
      assets:
        items:
          $ref: '#/definitions/releasecheck.Asset'
        type: array
      html_url:
        type: string
      notes:
        type: string
      published_at:
        type: string
      tag_name:
        type: string
    type: object
  sql.NullString:
    properties:
      string:
        type: string
      valid:
        description: Valid is true if String is not NULL
        type: boolean
    type: object
  store.Column:
    properties:
      auto_advance:
        type: integer
      id:
        type: integer
      lifecycle_mapping:
        type: string
      name:
        type: string
      phase_prompt:
        $ref: '#/definitions/sql.NullString'
      position:
        type: integer
      project_id:
        type: integer
      reviewer_agent:
        $ref: '#/definitions/sql.NullString'
    type: object
host: localhost:3000
info:
  contact:
    name: Niuniu
    url: https://github.com/niuniu-dev/niuniu
  description: Niuniu is a full-stack application for managing multi-project, multi-task
    parallel development with Claude Code integration.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Niuniu API
  version: 1.0.0
paths:
  /app-update/latest:
