  /mission-control:
    get:
      description: 'Two independent panels: Intake (today accepted / pending / approval
        / misfire / duplicate / event-to-start, per source+chat daily counts) and
        Completion (in progress / stuck / first pass / avg rounds / fake completion
        / interventions / today tokens+cost). Scoped to the caller''s accessible projects;
        ?owner=user:<id>|org:<slug> narrows further.'
      parameters:
      - description: owner filter
        in: query
        name: owner
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
