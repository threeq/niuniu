            $ref: '#/definitions/internal_api.Error'
      summary: Mission control metrics
      tags:
      - MissionControl
  /mission-control/pause:
    put:
      consumes:
      - application/json
      description: Flips the intake stop switch on all accessible projects (or the
        ?owner= subset). Pausing only stops inferred/auto work; explicit requests
        keep flowing.
      parameters:
      - description: owner filter
        in: query
        name: owner
        type: string
      - description: Pause state
        in: body
        name: body
        required: true
        schema:
          properties:
            paused:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              paused:
                type: boolean
              projects:
                type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.Error'
      summary: Pause or resume intake for every project in scope
      tags:
      - MissionControl
  /projects:
