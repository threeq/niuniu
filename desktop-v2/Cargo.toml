[package]
name = "niuniu-desktop-v2"
version = "0.1.0"
description = "牛牛桌面版 v2 —— Tauri v2 壳层（替代 Wails v3）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "niuniu_desktop_v2"
# 纯桌面应用：只产出 rlib 供 main bin 链接。不带 cdylib —— Windows GNU 工具链
# 上 cdylib 的 DLL 导出表会撞 "export ordinal too large"（windows 导入库过大）。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "5"
base64 = "0.22"
chrono = "0.4"
sys-locale = "0.3"
ureq = "2"
mdns-sd = "0.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
