name: Release

# 打包 desktop-v2（Tauri，唯一桌面版）并发布到【本仓库】(threeq/niuniu) 的
# GitHub Release。触发：向本仓库推送 vX.Y.Z 标签 → 构建 Windows(.exe) /
# macOS(.dmg ×2 arch) / Linux(.AppImage) → 发布。
#
# 流程（每个平台 job 相同的三段式）：
#   1. pnpm build 嵌入式 SPA（server/web/dist）
#   2. make build-personal-v2-<os>   → _personal-prepare 构建 Go server/mcp
#      侧车（zig cc / clang 处理 libwebp cgo）staging 到 desktop-v2/binaries/
#   3. cargo build --release --target <triple>   → build.rs include_bytes!
#      把侧车内嵌进单文件产物
# macOS 额外经 package.sh 包 .app + .dmg（签名/公证由 "Apple Build" 环境的
# MACOS_CERT_* / APPLE_API_* secrets 启用）；Linux 经 package.sh 包 AppImage。
#
# release notes 用 GitHub 自动生成（--generate-notes）。

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write          # 在本仓库创建 Release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  prepare:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
      - name: Create draft release (auto notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，先删除重建"
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target main \
            --draft

  build-windows:
    name: Build desktop-v2 (windows-amd64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ env.TAG }}'
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: server/web/pnpm-lock.yaml }
      - name: Build embedded SPA
        run: cd server/web && pnpm install --frozen-lockfile && pnpm build
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop-v2 }
      - name: make build-personal-v2-windows
        shell: bash
        run: VERSION="$TAG" make build-personal-v2-windows
      - name: Upload Windows .exe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber bin/niuniu-desktop-v2-*-windows-amd64.exe

  build-darwin:
    name: Build desktop-v2 (darwin)
    needs: prepare
    runs-on: macos-latest
    environment: Apple Build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ env.TAG }}'
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: server/web/pnpm-lock.yaml }
      - name: Build embedded SPA
        run: cd server/web && pnpm install --frozen-lockfile && pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop-v2 }
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 未配置 — macOS 签名必需，无法发布"
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"
      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 未配置 — macOS 公证必需，无法发布"
            exit 1
          fi
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: make package-personal-v2-darwin
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          VERSION="$TAG" make package-personal-v2-darwin
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
      - name: Upload macOS .dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber bin/niuniu-desktop-v2-*-darwin-*.dmg

  build-linux:
    name: Build desktop-v2 (linux-amd64)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ env.TAG }}'
      - name: Install Tauri Linux deps (GTK / WebKit2GTK 4.1 / libsoup3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: server/web/pnpm-lock.yaml }
      - name: Build embedded SPA
        run: cd server/web && pnpm install --frozen-lockfile && pnpm build
      - uses: mlugg/setup-zig@v2
        with: { version: 0.16.0 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop-v2 }
      - name: make package-personal-v2-linux
        run: VERSION="$TAG" make package-personal-v2-linux
      - name: Upload Linux AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber bin/niuniu-desktop-v2-*-linux-amd64.AppImage

  publish:
    name: Publish release
    needs: [prepare, build-windows, build-darwin, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ env.TAG }}'
      - name: Flip draft → public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "✅ Release $TAG 已发布到 threeq/niuniu"
