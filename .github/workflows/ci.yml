name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # server/web embeds dist/ at build time; create a placeholder so the
      # Go build succeeds without a full frontend build.
      - name: Prepare web embed placeholder
        run: mkdir -p server/web/dist && touch server/web/dist/.gitkeep

      # desktop/internal/bundle embeds server-bin/<os>-<arch>/niuniu-server and
      # -mcp, which only exist after the release flow's `make _personal-prepare`
      # builds them. For a compile/vet check that would be overkill (needs CGO +
      # zig + a full SPA build), so seed empty placeholders so `go:embed` resolves.
      # The bytes are only read at runtime, so they're irrelevant to a build check.
      - name: Prepare desktop bundle embed placeholders
        run: |
          mkdir -p desktop/internal/bundle/server-bin/linux-amd64
          touch desktop/internal/bundle/server-bin/linux-amd64/niuniu-server
          touch desktop/internal/bundle/server-bin/linux-amd64/niuniu-mcp

      - name: Build server
        run: cd server && go build ./...

      - name: Vet server
        run: cd server && go vet ./...

      - name: Build go-shared
        run: cd go-shared && go build ./...

      # The desktop module pulls in Wails v3, which needs the Linux GTK / WebKit
      # headers to compile (same deps the release build-linux job installs).
      - name: Install desktop Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Build desktop
        run: cd desktop && go build ./...
