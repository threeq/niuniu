name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # server/web embeds dist/ at build time; create a placeholder so the
      # Go build succeeds without a full frontend build.
      - name: Prepare web embed placeholder
        run: mkdir -p server/web/dist && touch server/web/dist/.gitkeep

      - name: Build server
        run: cd server && go build ./...

      - name: Vet server
        run: cd server && go vet ./...

      - name: Build go-shared
        run: cd go-shared && go build ./...

  # agent/ is a separate Go module (the built-in engine). Build, vet and test
  # it here so engine regressions surface in CI instead of only at desktop
  # packaging time.
  agent:
    name: agent build & vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build agent
        run: cd agent && go build ./...
      - name: Vet agent
        run: cd agent && go vet ./...
      - name: Test agent
        run: cd agent && go test ./...

  # desktop-v2 (Tauri v2) compile check. Tauri needs the Linux GTK /
  # WebKitGTK dev headers; the Go sidecars are NOT embedded for cargo check
  # (build.rs only turns on have_embedded_sidecars for release builds with
  # staged binaries — a plain check falls back to the runtime file lookup).
  desktop-v2:
    name: desktop-v2 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux deps (GTK / WebKit2GTK 4.1 / libsoup3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-v2
      - name: cargo check
        run: cd desktop-v2 && cargo check --locked

  # The sandbox fence for operation functions (#739) is OS-specific — Windows
  # AppContainer + Job Object, macOS seatbelt, Linux user namespaces + Landlock
  # + seccomp. Cross-compiling proves none of it: the escape attempts have to be
  # refused by a REAL kernel of each platform, so they run here rather than only
  # on whichever machine a developer happens to use. macOS in particular relies
  # on sandbox-exec, which Apple deprecates, so this job is what turns "still
  # works on macOS 15+" from an assumption into a measurement.
  sandbox-fence:
    name: sandbox fence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # -v matters: TestFenceDeniesReadSocketAndSpawn prints one line per escape
      # attempt with the OS's own refusal message, and TestSelfCheckReportsComponents
      # prints the per-component fence status, so a red run says WHICH part of
      # the fence failed instead of only that something did. A missing or
      # ineffective fence makes these tests FAIL, never skip.
      - name: Sandbox & operation-function tests
        run: |
          cd server
          go test -count=1 -timeout 20m -v \
            -run 'TestOperationFunction|TestFenceDenies|TestSelfCheck|TestRunFunction|TestRunaway|TestEgressBudget|TestBoxCrash|TestRunnerRecovers|TestSpawnRefused|TestURLIsNotExpressible|TestUndeclaredOperation|TestClassifyProbes|TestProbesMark' \
            ./internal/sandbox/ ./internal/service/ ./cmd/niuniu-funcbox/
