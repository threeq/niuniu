version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/store/queries"
    schema: "internal/store/schema.sql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_empty_slices: true
        rename:
          # knowledge_bases singularizes to "KnowledgeBasis"; force a clean name.
          knowledge_basis: "KnowledgeBase"