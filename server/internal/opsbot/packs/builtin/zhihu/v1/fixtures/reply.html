<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>创作者中心 - 回复评论</title>
</head>
<body>
  <main class="InteractionPage">
    <div class="InteractionSearch interaction-search">
      <input placeholder="搜索评论或私信">
    </div>

    <section class="InteractionList comment-list">
      <article class="InteractionItem comment-item" data-id="c_10001" data-kind="comment">
        <span class="author">知友A</span>
        <span class="content">这篇的分层论证很清楚，想请教下第二个方法的数据来源</span>
      </article>
    </section>

    <div class="ReplyEditor reply-input comment-reply">
      <div contenteditable="true" class="CommentEditor" data-placeholder="回复评论"></div>
      <button class="ReplyEditor-send send-btn" type="button">发送</button>
    </div>

    <div class="ReplySent toast-success">回复已发送</div>
  </main>
</body>
</html>
