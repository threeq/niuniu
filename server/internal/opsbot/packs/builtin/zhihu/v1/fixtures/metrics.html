<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>创作者中心 - 内容分析</title>
</head>
<body>
  <main class="CreatorDashboard ContentManage">
    <button class="DateRangePicker date-range" type="button">近 7 天</button>
    <div class="DateRange-panel">
      <button class="range-preset preset-7d" data-range="7d" type="button">近 7 天</button>
      <button class="range-preset preset-30d" data-range="30d" type="button">近 30 天</button>
      <button class="range-confirm DateRange-confirm" type="button">确定</button>
    </div>

    <section class="MetricsOverview DataOverview">
      <div class="metric-row"><span class="label">阅读</span><span class="metric-read metric-reads">12,345</span></div>
      <div class="metric-row"><span class="label">赞同</span><span class="metric-upvote metric-upvotes">678</span></div>
      <div class="metric-row"><span class="label">评论</span><span class="metric-comment metric-comments">90</span></div>
      <div class="metric-row"><span class="label">收藏</span><span class="metric-collect metric-collects">45</span></div>
      <div class="metric-row"><span class="label">分享</span><span class="metric-share metric-shares">12</span></div>
      <div class="metric-row"><span class="label">新增关注</span><span class="metric-fans metric-fans-add">8</span></div>
    </section>
  </main>
</body>
</html>
