<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>消息回复 - 小红书创作服务平台</title>
</head>
<body>
  <aside class="conversation-list message-list comment-list">
    <div class="message-search conversation-search">
      <input placeholder="搜索用户或评论">
    </div>
    <div class="conversation-item comment-item" data-id="c_10001">
      <span class="author">用户A</span>
      <p class="preview">请问这个颜色显白吗？</p>
    </div>
    <div class="conversation-item comment-item" data-id="c_10002">
      <span class="author">用户B</span>
      <p class="preview">求链接</p>
    </div>
  </aside>

  <section class="chat-input">
    <textarea class="reply-input comment-reply-input" placeholder="回复评论"></textarea>
    <button class="send-button send-btn" type="button">发送</button>
  </section>

  <div class="message sent" hidden>
    <span>回复已发送</span>
  </div>
</body>
</html>
