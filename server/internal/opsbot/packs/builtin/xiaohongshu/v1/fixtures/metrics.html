<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>笔记数据 - 小红书创作服务平台</title>
</head>
<body>
  <section class="data-dashboard">
    <button class="date-filter date-range-picker" type="button">近 7 天</button>
    <div class="range-picker" hidden>
      <button class="preset-7d range-preset" data-range="7d" type="button">近 7 天</button>
      <button class="preset-30d range-preset" data-range="30d" type="button">近 30 天</button>
      <button class="preset-90d range-preset" data-range="90d" type="button">近 90 天</button>
      <button class="date-confirm range-confirm" type="button">确定</button>
    </div>

    <table class="data-table metrics-table">
      <thead>
        <tr><th>笔记</th><th>观看</th><th>点赞</th><th>收藏</th><th>评论</th><th>分享</th><th>涨粉</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>测试笔记</td>
          <td class="metric-views metric-view">1234</td>
          <td class="metric-likes metric-like">210</td>
          <td class="metric-collects metric-collect">98</td>
          <td class="metric-comments metric-comment">17</td>
          <td class="metric-shares metric-share">6</td>
          <td class="metric-fans metric-fans-add">12</td>
        </tr>
      </tbody>
    </table>
  </section>
</body>
</html>
