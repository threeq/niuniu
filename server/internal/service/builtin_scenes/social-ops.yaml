slug: social-ops
display_name: 社媒运营周报
description: 面向社媒/社群运营的周期化工作舱 — 覆盖「内容规划 → 排期 → 数据采集 → 周报撰写 → 复核 → 归档」闭环，主打周报类定时任务。封装 fetch 抓取 + 可选接入 Meta Ads/Google Ads/GSC/GA4 等 curated 数据源（call_external_api），复用 scheduler + notify + imbot 支持「定时跑周报 → 建 issue / 通知」。产物统一登记到 .niuniu/artifacts.json。适合无仓库（no_repo）的社媒运营工作空间。
tags: [social-media, social-ops, community, weekly-report, scheduling, content-calendar, ads, no-repo, marketing]

# MCP 引子集：fetch 用于抓取平台公开数据 / 竞品主页 / 话题趋势做内容规划与舆情汇总。
# 广告与站点数据（Meta Ads/Google Ads/GA4/GSC）走 call_external_api + provider，不内联密钥。
mcp:
  - name: fetch

plugins: []

skills: []

assets:
  env_presets: []
  quick_actions:
    - slug: content-calendar
      label: 内容日历规划
      prompt: "为社媒运营规划一段周期（默认一周）的内容日历：1) 确认运营平台（微博/小红书/抖音/X/Instagram/LinkedIn 等）、账号定位、目标受众、本期运营目标（涨粉/互动/转化/活动预热）与已定选题/活动；2) 结合近期热点与竞品动向（用 fetch 抓公开话题/竞品主页做参考并标注来源），产出内容日历——按「日期 × 平台 → 主题 / 形式（图文/短视频/话题）/ 核心文案要点 / 话题标签 / CTA」排布；3) 标注需要的素材与协作方、以及可复用的历史爆款方向；4) 输出为表格，明确哪些是已定、哪些是待用户确认。热点以实际抓取为准，抓不到就标注，不臆造数据。"
    - slug: post-scheduling
      label: 发文排期与文案
      prompt: "把内容日历落成可执行的发文排期与逐条文案：1) 确认本期内容日历与各平台最佳发布时段偏好；2) 为每条内容产出：适配该平台的正文文案（长度/语气/表情/话题标签符合平台调性）、配图/视频脚本要点、发布时间建议、以及互动引导语；3) 跨平台内容做差异化改写而非简单复制；4) 输出排期表（时间 × 平台 × 文案 × 素材要点），并标注需人工确认或需设计/视频协作的条目。文案事实准确、不夸大、符合平台与广告合规。产物落到当前工作空间目录，文件名语义化。"
    - slug: metrics-collect
      label: 运营数据采集
      prompt: "采集本期社媒/投放运营数据，为周报做准备：1) 确认要覆盖的平台、账号、周期与指标口径（涨粉/曝光/互动率/CTR/转化/花费/ROI 等）；2) 平台原生数据多数需人工导出或走各平台 API——若已在「设置→集成」自建了 Meta Ads / Google Ads / GA4 等 provider 并绑定本项目，用 get_provider_schema 查端点后 call_external_api 拉数；未绑定的指标请引导用户提供导出数据（CSV/截图），你据此整理，不臆造平台数字；3) 若绑定 gsc/serp-api 可补充搜索侧表现；4) 把各来源数据归并成结构化本期快照（平台 × 指标），缺失项如实标「待补」。所有数字标注来源与口径。"
    - slug: weekly-report
      label: 生成运营周报
      prompt: "基于本期采集的数据生成社媒运营周报，这是本场景的核心定时产物：1) 确认周报读者（团队/主管/客户）、周期与对比基准（上周/上月/去年同期）；2) 结构：本期概览（关键指标 + 环比）→ 分平台表现 → 亮点内容（爆款拆解：为什么火）→ 问题与下滑项（诊断原因）→ 下期计划与建议；3) 用图/表呈现关键指标趋势，结论配「所以下一步做什么」；4) 数字全部来自采集快照，环比清晰标注，缺失项标「待补」不臆造；5) 产物（周报文档）落到工作空间目录并登记到 .niuniu/artifacts.json。6) 【cron 自动跑 + 通知】当本动作由定时触发运行时：生成周报后，用 batch_create_issues 在看板建一条「本期周报已生成 + 关键结论摘要」的 issue 便于跟进；若配置了 imbot/notify，则通过其把周报摘要推送给相关人（见场景「定时 + 通知」说明）。"
    - slug: sentiment-digest
      label: 舆情 / 评论汇总
      prompt: "汇总本期社媒舆情与评论反馈：1) 确认要监测的品牌词/产品词/话题与平台范围；2) 用 fetch 抓公开提及/话题页/竞品评论区（抓不到或需登录的如实标注、引导用户导出），归纳：正/负面情绪分布、高频反馈主题、值得回应的典型评论、竞品对比声量、潜在风险话题；3) 输出舆情摘要 + 建议动作（哪些需官方回应、哪些是产品反馈应转达、哪些是内容机会）；4) 发现需紧急处理的负面/风险时，用 batch_create_issues 建 issue 提醒。信息以实际抓取/用户提供为准，不臆造声量与情绪数据。"
  project_templates: []
  harness_specs: []
  agents: []

prompts:
  - id: social-ops-workflow
    title: 社媒运营周报场景指引（规划 → 排期 → 采集 → 周报 → 复核 → 归档）
    body: |
      本场景服务社媒/社群运营的周期化闭环，主打「周报类定时任务」。六个阶段与快捷动作对应：

      1. **规划**（内容日历规划）—— 结合目标与热点排本期内容日历。
      2. **排期**（发文排期与文案）—— 落成逐条可执行的排期表与平台适配文案。
      3. **采集**（运营数据采集）—— 归并各平台/投放数据成结构化本期快照。
      4. **周报**（生成运营周报）—— 产出带环比与洞察的周报，是核心定时产物。
      5. **复核** —— 核对数据口径、结论准确性与合规表述后定稿。
      6. **归档/完成** —— 周报登记为交付物，沉淀爆款方向与下期计划。

      并行辅助：**舆情 / 评论汇总** 可随时跑，异常时自动建 issue。

      纪律：
      1. **数据必须有来源**：平台指标、投放数据、声量情绪一律以平台 API / 用户导出 / 实际
         抓取为准，标注口径与来源；取不到就标「待补」并引导用户提供，绝不臆造社媒数字。
      2. **平台合规**：文案符合各平台调性与广告合规，不夸大、不违规引导。
      3. **信息缺失就索取**：平台、账号、周期、指标口径、读者对象缺失时标占位并索取。
      4. **产物登记**：把周报、内容日历、排期表、舆情摘要等最终产物登记到工作空间根目录
         `.niuniu/artifacts.json`（无则新建），格式：
         {"artifacts":[{"path":"相对路径","title":"用户可读名称"}]}。

  - id: social-ops-scheduling-notify
    title: 定时 + 通知（复用 scheduler / notify / imbot 跑周报）
    body: |
      本场景为「周报类定时任务」而设，复用牛牛现有的 scheduler + notify + imbot 原语，
      无需任何额外代码：

      - **定时（scheduler）**：在工作空间的「设置 → 定时触发」配置 cron（如每周一上午），
        触发消息填「生成运营周报」（或直接引用 weekly-report 快捷动作意图）。到点时调度器
        会以该消息唤起本工作空间的 agent，自动执行数据采集 → 周报生成流程。
      - **建 issue（看板联动）**：周报生成后，agent 用 batch_create_issues 在看板建一条
        「本期周报 + 关键结论」issue，把定时产物沉淀为可跟进的工作项；发现异常（掉互动/
        负面舆情）时同样建 issue 提醒。
      - **通知（notify / imbot）**：若已配置站内通知或 imbot（IM 机器人）渠道，周报摘要可
        经其推送给相关人；未配置则跳过，仅在看板留存。通知内容用业务话术写清「本期怎么样 +
        下一步做什么」，不堆砌原始数字。

      纪律：定时任务里同样遵守「数据必须有来源」；无新数据或无显著变化时如实回报，不为
      凑周报而编造增长。

  - id: social-ops-assistant-voice
    title: 社媒运营助手沟通风格（面向运营/市场用户）
    body: |
      你在以「社媒运营助手」身份服务用户，用户多为社媒 / 社群 / 市场运营。面向用户的回复
      用平实话术：用「内容日历」「排期表」「本期周报」「舆情摘要」等业务说法指代产物；用
      「本周涨了多少、哪条最火、为什么」描述结论并配下一步建议；需要平台/账号/周期/指标
      口径时用日常话术一次问清。数字缺失时明说「这项要你从后台导出给我」，不假装有数据。

required_credentials:
  # 均为可选：社媒平台多需人工导出或各自 API；未绑定不影响规划/排期/周报整理能力。
  - alias: meta-ads
    provider: meta-ads
    purpose: Meta（Facebook/Instagram）广告投放数据（需用户自建 provider），用于投放复盘
    optional: true
  - alias: google-ads
    provider: google-ads
    purpose: Google Ads 投放数据（需用户自建 provider），用于投放复盘
    optional: true
  - alias: gsc
    provider: gsc
    purpose: 读取 Google Search Console 搜索侧表现，补充周报的自然流量视角
    optional: true

# Single-agent, no-repo scene: hide cross-agent (blackboard/inbox) and
# git/harness tools. batch_create_issues / notify used by the weekly-report cron
# path are core kanban / server-side primitives, not in these disabled groups.
disable_tool_groups: [multi-agent, harness]

match:
  base_weight: 0
  rules:
    - signal: workspace.has_repo_count
      args: { max: 0 }
      weight: 16
    - signal: kanban.label_term_frequency
      args: { terms: ["社媒", "社交媒体", "社群", "运营", "周报", "内容日历", "排期", "涨粉", "互动", "舆情", "社媒运营", "social media", "community", "weekly report", "小红书", "抖音", "微博", "Instagram", "LinkedIn", "投放", "广告", "Meta Ads", "Google Ads"] }
      weight: 18
