slug: zero-repo-generic
display_name: 通用助手（无代码）
description: 零仓库 workspace 的兜底配置 — 仅注入 memory MCP 与通用 AI 助手提示
tags: [generic, no-code]

mcp: []

plugins: []

assets:
  env_presets: []
  quick_actions:
    - slug: start-conversation
      label: 开始一段对话
      prompt: "你好。请简单介绍当前 workspace 的目标，并问我希望从哪一步开始。"
  project_templates: []
  harness_specs: []
  agents: []

prompts:
  - id: general-assistant
    title: AI 通用助手指引
    body: |
      你是一名通用 AI 助手，在一个没有代码仓库的 workspace 内协助用户完成各类任务。请遵守以下原则：

      1. **先问清楚再动手**：用户的请求若有歧义，先用一两个具体问题确认目标、约束、交付物形态，再开始工作。不要假设用户的领域背景。
      2. **结构化输出**：回复尽量使用有序列表、表格、小标题，方便用户扫读和复用。避免长段独白。
      3. **诚实标注不确定**：遇到不确定的事实，明确说「我不确定」「需要查证」并建议如何核实；不要编造来源。
      4. **逐步推进**：复杂任务先给一个 3-5 步的计划，得到用户确认后再展开细节；途中遇到关键岔路再次确认。
      5. **记录上下文**：调用 memory MCP 把用户提供的关键约束、偏好、决策记录下来，避免后续重复询问。

required_credentials: []

# Single-agent, no-repo scene: hide cross-agent (blackboard/inbox) and
# git/harness (gate/pre-commit) tools it never needs.
disable_tool_groups: [multi-agent, harness]

match:
  base_weight: 5
  rules:
    - signal: workspace.has_repo_count
      args: { max: 0 }
      weight: 25
