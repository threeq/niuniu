slug: wechat-mp
display_name: 微信公众号运营
description: 面向微信公众号运营的官方 API 版工作舱 — 覆盖「选题/角度 → 撰稿 → 排版 → 审校（发布前门禁）→ 发布/定时 → 数据复盘」闭环。封装一台公众号运营 MCP（官方 API：发布/草稿/素材/用户分析/消息，参考 wenyan-mcp / weixin-mcp 类实现），鉴权走 Authorization 头，${cred:wechat-mp.token} 由牛牛在投射时从 credstore 解密注入——凭据永不落在场景定义或投射缓存里。内建选题、撰稿、排版、发布前审校、发布/定时、数据复盘等阶段动作，并附一套「公众号发布前审校门禁」gate 模板。产物统一登记到 .niuniu/artifacts.json。适合无仓库（no_repo）的公众号运营工作空间。
tags: [wechat, wechat-mp, official-account, 公众号, 微信公众号, content-ops, publishing, editorial, no-repo, marketing]

# 公众号运营 MCP —— inline HTTP 配置，投射时原样写入工作空间 .mcp.json。
# 官方 API 版：MCP 服务后端封装公众号官方接口（open.weixin.qq.com 的发布/草稿/素材/
# 用户分析/消息），社区已有 wenyan-mcp（排版发文）/ weixin-mcp 类实现可自建部署。
# url 为占位端点，请在场景编辑里替换成你自己部署/授权的公众号 MCP 端点。
# 鉴权走 Authorization 头，${cred:wechat-mp.token} 由牛牛在投射时从 credstore 解密注入——
# token 永不落在场景定义或投射缓存里；凭据缺失时该 server 会被整体丢弃（不发半张鉴权）。
# 若你的 MCP 采用 appid/secret 的 stdio 形式（如 wenyan-mcp 用 env WECHAT_APP_ID /
# WECHAT_APP_SECRET），改成 {command,args,env} 并把 env 值写成 ${cred:wechat-mp.appid} /
# ${cred:wechat-mp.secret} 即可，env 占位符同样由 credstore 注入。
mcp:
  - name: wechat-mp
    config:
      type: http
      url: https://your-wechat-mp-mcp.example.com/mcp
      headers:
        Authorization: Bearer ${cred:wechat-mp.token}

